# Global parameters shared across all regions.

eia860:
  plant_file: "2___Plant_Y2023.xlsx"
  generator_file: "3_1_Generator_Y2023.xlsx"
  wind_file: "3_2_Wind_Y2023.xlsx"
  solar_file: "3_3_Solar_Y2023.xlsx"
  storage_file: "3_4_Energy_Storage_Y2023.xlsx"
  skip_rows: 1

output:
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"

# ============================================================
# Synthetic Grid Configuration
# Parameters derived from Birchfield-style methodology
# (structural + topological, excluding conductor catalogs)
# ============================================================

# NOTE: Stage 1 (Substation Synthesis) and Stage 2 (Voltage Partition)
# parameters have been moved to region-specific configs (texas.yaml, new_york.yaml).
# This includes: voltage levels, pct_substations_with_high_voltage, and target_mn_ratio.
#
# The parameters below are shared defaults for Stage 3+ (Topology Generation).
# Region configs can override these if needed.

# -------------------------------------------------
# Transmission line construction category quotas
# -------------------------------------------------
# Target proportions of line types, based on Birchfield Table VI.
# These are mutually exclusive categories (MST edges not double-counted in Delaunay).
# Enforced softly using penalties.
delaunay_category_quotas:
  mst: 0.50         # Euclidean minimum spanning tree
  delaunay: 0.20    # Delaunay triangulation edges (non-MST)
  neighbor_2: 0.25  # 2nd-nearest Delaunay neighbors
  neighbor_3: 0.05  # 3rd-nearest Delaunay neighbors

# -----------------------------------------
# Line intersection control
# -----------------------------------------
# Same-voltage line crossings are rare in real grids.
# Synthetic grids are tuned to keep this rate low.
max_line_intersection_rate: 0.05   # 5%

# -------------------------------------------------
# Underground transmission heuristic
# -------------------------------------------------
# Lines are designated underground if they are:
#  - short (< 8 miles ≈ 12.9 km), and
#  - connect substations with large load
# "Large load" is implemented via percentile threshold.
underground_line:
  max_length_km: 12.9
  load_percentile_threshold: 75

# -----------------------------------------
# Distance metric
# -----------------------------------------
# All spatial distances use great-circle distance.
distance_metric: haversine_km

# -----------------------------------------
# Random seed
# -----------------------------------------
# Used for all stochastic elements:
# - high-voltage substation selection
# - any randomized tie-breaking
# Fixed for reproducibility.
random_seed: 42

#Birchfield et al. define overhead‐line R, X, B and MVA limits via equations (2)–(5). Using these formulas with typical overhead conductor data (e.g. bundled 345 kV ACSR Drake conductors and a single 138 kV ACSR Dove conductor) yields approximate per‐km parameters for overhead lines at 345 kV and 138 kV as follows:
345kV:
  R_per_km: 0.0393    # ohm/km (series resistance)
  X_per_km: 0.653     # ohm/km (series reactance)
  B_per_km: 6.02e-06  # S/km (shunt susceptance)
  MVA_limit: 1082    # MVA (thermal rating)
138kV:
  R_per_km: 0.105     # ohm/km
  X_per_km: 0.800     # ohm/km
  B_per_km: 3.28e-06  # S/km
  MVA_limit: 174     # MVA
